# Caminho correto para o JDK 11
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-11.0.28.6-hotspot

# Permitir AndroidX (necessário para Jetpack Compose, Firebase, etc.)
android.useAndroidX=true
android.enableJetifier=true

# Otimizações (opcional, mas recomendadas)
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# ? Suprime o aviso de compatibilidade com compileSdk 35
android.suppressUnsupportedCompileSdk=35
